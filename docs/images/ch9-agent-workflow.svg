<text x="50" y="70" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#213547" text-anchor="start">多模态 Agent 工作流（设计示意）</text><text x="50" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#5B6B7A" text-anchor="start">感知结果进入规划模块，按任务需要调用工具或直接回答；记忆模块为可选扩展。</text><g><rect x="55" y="255" width="180" height="110" rx="16" fill="#EAF1FF" stroke="#CBD5E1" stroke-width="1.5"/><text x="73" y="285" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">用户输入</text><text x="73" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">文本 + 图片 / 文档 / 截图</text></g><g><rect x="295" y="165" width="220" height="110" rx="16" fill="#EAF8F1" stroke="#CBD5E1" stroke-width="1.5"/><text x="313" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">感知模块</text><text x="313" y="221" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">摘要图像，提取字段</text><text x="313" y="241" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">识别关键视觉证据</text></g><g><rect x="295" y="345" width="220" height="110" rx="16" fill="#EAF1FF" stroke="#CBD5E1" stroke-width="1.5"/><text x="313" y="375" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">记忆模块</text><text x="313" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">保存摘要、历史偏好</text><text x="313" y="421" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">维持多轮上下文</text></g><g><rect x="575" y="255" width="220" height="110" rx="16" fill="#FFF6E5" stroke="#CBD5E1" stroke-width="1.5"/><text x="593" y="285" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">规划模块</text><text x="593" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">决定：直接回答？</text><text x="593" y="331" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">还是继续调工具？</text></g><g><rect x="855" y="165" width="230" height="110" rx="16" fill="#FFF0EC" stroke="#CBD5E1" stroke-width="1.5"/><text x="873" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">工具模块</text><text x="873" y="221" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">OCR / 检索 / 规则校验</text><text x="873" y="241" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">裁剪、解析、结构化</text></g><g><rect x="855" y="345" width="230" height="110" rx="16" fill="#EAF8F1" stroke="#CBD5E1" stroke-width="1.5"/><text x="873" y="375" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#213547" text-anchor="start">结果汇总</text><text x="873" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">汇总感知结果与可用工具输出</text><text x="873" y="421" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#5B6B7A" text-anchor="start">生成最终回答或动作建议</tex