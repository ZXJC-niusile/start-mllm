<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-label="多模态 Agent v2 工作流">
<style>text {font-family: 'Microsoft YaHei', sans-serif; fill:#24364b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2b63d9"/></marker></defs>
<rect width="1280" height="650" fill="white"/>
<text x="45" y="55" font-size="30" font-weight="700">多模态 Agent v2 工作流</text>
<text x="45" y="95" font-size="19" font-weight="400">无工具调用时，直接返回感知与规划阶段生成的回答。</text>
<rect x="40" y="235" width="190" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="58" y="267" font-size="22" font-weight="700">用户输入</text>
<text x="58" y="300" font-size="17" font-weight="400">图片与问题</text>
<rect x="290" y="235" width="230" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="308" y="267" font-size="22" font-weight="700">感知与规划</text>
<text x="308" y="300" font-size="17" font-weight="400">perceive_and_plan()</text>
<text x="308" y="326" font-size="17" font-weight="400">回答或请求工具</text>
<rect x="615" y="150" width="230" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="633" y="182" font-size="22" font-weight="700">执行工具</text>
<text x="633" y="215" font-size="17" font-weight="400">execute_tools()</text>
<text x="633" y="241" font-size="17" font-weight="400">保留 tool_call_id</text>
<rect x="905" y="150" width="230" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="923" y="182" font-size="22" font-weight="700">汇总回答</text>
<text x="923" y="215" font-size="17" font-weight="400">summarize()</text>
<text x="923" y="241" font-size="17" font-weight="400">使用工具结果与图像</text>
<rect x="1010" y="405" width="230" height="125" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="1028" y="437" font-size="22" font-weight="700">返回结果</text>
<text x="1028" y="470" font-size="17" font-weight="400">final_answer</text>
<path d="M230 300H290" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M520 265H565V215H615" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="535" y="185" font-size="17" font-weight="400">调用工具</text>
<path d="M845 215H905" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1130 280V405" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M405 365V465H1010" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="620" y="445" font-size="18" font-weight="400">无工具调用：直接返回已有回答</text>
<text x="45" y="590" font-size="19" font-weight="400">对应 v2 脚本的一轮工具调用；示例工具当前返回 not_implemented。</text>
</svg>
