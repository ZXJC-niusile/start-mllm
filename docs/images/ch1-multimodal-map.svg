<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-label="图文问答的信息路径">
<style>text {font-family: 'Microsoft YaHei', sans-serif; fill:#24364b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2b63d9"/></marker></defs>
<rect width="1280" height="650" fill="white"/>
<text x="45" y="55" font-size="30" font-weight="700">图文问答的信息路径</text>
<text x="45" y="95" font-size="19" font-weight="400">图像与文本分别编码，在语言模型中融合。</text>
<rect x="40" y="160" width="180" height="120" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="58" y="192" font-size="22" font-weight="700">图像输入</text>
<text x="58" y="225" font-size="17" font-weight="400">截图、票据、文档</text>
<rect x="280" y="160" width="200" height="120" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="298" y="192" font-size="22" font-weight="700">视觉编码器</text>
<text x="298" y="225" font-size="17" font-weight="400">像素 → 视觉特征</text>
<rect x="540" y="160" width="200" height="120" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="558" y="192" font-size="22" font-weight="700">连接模块</text>
<text x="558" y="225" font-size="17" font-weight="400">映射视觉表示</text>
<rect x="40" y="355" width="180" height="120" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="58" y="387" font-size="22" font-weight="700">文本输入</text>
<text x="58" y="420" font-size="17" font-weight="400">用户问题与指令</text>
<rect x="280" y="355" width="285" height="120" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="298" y="387" font-size="22" font-weight="700">Tokenizer + Embedding</text>
<text x="298" y="420" font-size="17" font-weight="400">文本 → token ID → 向量</text>
<rect x="800" y="245" width="205" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="818" y="277" font-size="22" font-weight="700">语言模型</text>
<text x="818" y="310" font-size="17" font-weight="400">融合图文信息</text>
<text x="818" y="336" font-size="17" font-weight="400">生成回答 token</text>
<rect x="1065" y="245" width="180" height="130" rx="14" fill="#eef4fc" stroke="#cbd5e1"/>
<text x="1083" y="277" font-size="22" font-weight="700">输出</text>
<text x="1083" y="310" font-size="17" font-weight="400">解码为文本回答</text>
<path d="M220 220H280" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M480 220H540" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M740 220H770V280H800" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M220 415H280" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M565 415H770V340H800" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1005 310H1065" fill="none" stroke="#2b63d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="560" font-size="20" font-weight="400">此图展示 Connector + LLM 路线；用户文本经分词和嵌入进入语言模型。</text>
</svg>
