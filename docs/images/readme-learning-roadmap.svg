<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Start-MLLM 知识地图">
<style>text {font-family: 'Microsoft YaHei', sans-serif; fill:#24364b}</style>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="50" y="60" font-size="30" font-weight="700">Start-MLLM 知识地图</text><text x="50" y="100" font-size="19" font-weight="400">基础知识、模型原理、训练评测与应用开发</text>
<rect x="50" y="140" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="74" y="178" font-size="24" font-weight="700">基础篇 00—09</text><text x="74" y="218" font-size="19" font-weight="400">环境、张量、自动求导</text><text x="74" y="248" font-size="19" font-weight="400">训练、Tokenizer 与 Transformer</text><rect x="460" y="140" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="484" y="178" font-size="24" font-weight="700">第 1—3 章 · 原理</text><text x="484" y="218" font-size="19" font-weight="400">任务、视觉编码与对齐</text><text x="484" y="248" font-size="19" font-weight="400">连接模块、交叉注意力与生成</text><rect x="870" y="140" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="894" y="178" font-size="24" font-weight="700">第 4 章 · 训练</text><text x="894" y="218" font-size="19" font-weight="400">数据格式与质量</text><text x="894" y="248" font-size="19" font-weight="400">监督微调、LoRA 与实验设计</text><rect x="50" y="375" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="74" y="413" font-size="24" font-weight="700">第 5—6 章 · 评测部署</text><text x="74" y="453" font-size="19" font-weight="400">评测数据与结果分析</text><text x="74" y="483" font-size="19" font-weight="400">推理服务、日志与资源预算</text><rect x="460" y="375" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="484" y="413" font-size="24" font-weight="700">第 7—9 章 · 应用</text><text x="484" y="453" font-size="19" font-weight="400">推理脚本、图像问答 Demo</text><text x="484" y="483" font-size="19" font-weight="400">工具调用与多模态 Agent</text><rect x="870" y="375" width="380" height="190" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="894" y="413" font-size="24" font-weight="700">第 10 章 · 项目安排</text><text x="894" y="453" font-size="19" font-weight="400">选择任务与产出</text><text x="894" y="483" font-size="19" font-weight="400">安排实验、记录结果</text><text x="50" y="650" font-size="20" font-weight="400">阅读顺序见前言；本图按章节列出知识范围。</text>
</svg>
