<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="VLM 的匹配与生成架构">
<style>text {font-family: 'Microsoft YaHei', sans-serif; fill:#24364b}</style>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="50" y="60" font-size="30" font-weight="700">VLM 的匹配与生成架构</text><text x="50" y="100" font-size="19" font-weight="400">双塔用于图文匹配；后三类关注多模态生成。</text>
<rect x="50" y="140" width="565" height="210" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="74" y="178" font-size="24" font-weight="700">双塔匹配</text><text x="74" y="218" font-size="19" font-weight="400">图像 → 图像编码器 → 图像向量</text><text x="74" y="248" font-size="19" font-weight="400">文本 → 文本编码器 → 文本向量</text><text x="74" y="278" font-size="19" font-weight="400">相似度用于匹配或检索，例如 CLIP。</text><rect x="665" y="140" width="565" height="210" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="689" y="178" font-size="24" font-weight="700">Connector + LLM</text><text x="689" y="218" font-size="19" font-weight="400">图像 → 视觉编码器 → 连接模块</text><text x="689" y="248" font-size="19" font-weight="400">视觉表示与文本一起输入语言模型。</text><text x="689" y="278" font-size="19" font-weight="400">例如 LLaVA；连接模块可采用 MLP。</text><rect x="50" y="390" width="565" height="210" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="74" y="428" font-size="24" font-weight="700">Cross-Attention</text><text x="74" y="468" font-size="19" font-weight="400">视觉编码器提供视觉特征。</text><text x="74" y="498" font-size="19" font-weight="400">语言层通过交叉注意力读取视觉特征。</text><text x="74" y="528" font-size="19" font-weight="400">例如 Flamingo、Llama 3.2 Vision。</text><rect x="665" y="390" width="565" height="210" rx="16" fill="#eef4fc" stroke="#cbd5e1"/><text x="689" y="428" font-size="24" font-weight="700">统一序列建模</text><text x="689" y="468" font-size="19" font-weight="400">将多种模态表示组织到序列中。</text><text x="689" y="498" font-size="19" font-weight="400">模型学习模态之间的生成关系。</text><text x="689" y="528" font-size="19" font-weight="400">具体编码与生成目标依模型而异。</text><text x="50" y="660" font-size="20" font-weight="400">四类设计用于比较信息如何融合；统一序列与连接模块等设计可以组合使用。</text>
</svg>
