name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests
        run: python scripts/run_tests.py
      - name: Local documentation links
        run: python scripts/check_docs.py
      - name: Whitespace
        run: git diff --check
