name: GitHub Star History

on:
  schedule:
    - cron: '0 0 * * *' # 每天午夜运行一次
  workflow_dispatch: # 允许在 Actions 面板手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Generate star history
        uses: guangzhengli/github-star-history-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Move to images folder
        run: |
          mkdir -p docs/images
          mv star-history.svg docs/images/star-history.svg
          
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: auto-update star history chart [skip ci]"
          file_pattern: docs/images/star-history.svg
